<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonicity - Test Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .test-section {
            background-color: white;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sonicity - Test Page</h1>
        
        <div class="test-section">
            <h2>Test Game Loading</h2>
            <p>Click the button below to test if the game loads correctly:</p>
            <button id="testButton">Test Game Loading</button>
            <div id="result"></div>
        </div>
        
        <div class="test-section">
            <h2>Test Three.js</h2>
            <p>Click the button below to test if Three.js is working correctly:</p>
            <button id="testThreeButton">Test Three.js</button>
            <div id="threeResult"></div>
        </div>
    </div>

    <!-- Import Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/examples/jsm/loaders/FBXLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/FBXLoader.js",
                "three/src/loaders/TextureLoader.js": "https://unpkg.com/three@0.160.0/src/loaders/TextureLoader.js",
                "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js"
            }
        }
    </script>

    <script type="module">
        // Test Game Loading
        document.getElementById('testButton').addEventListener('click', async () => {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing game loading...';
            resultDiv.className = '';
            
            try {
                // Try to import the Game class
                const { Game } = await import('./game.js');
                resultDiv.innerHTML = 'Game class loaded successfully!';
                resultDiv.className = 'success';
            } catch (error) {
                resultDiv.innerHTML = `Error loading game: ${error.message}`;
                resultDiv.className = 'error';
                console.error('Error loading game:', error);
            }
        });

        // Test Three.js
        document.getElementById('testThreeButton').addEventListener('click', async () => {
            const resultDiv = document.getElementById('threeResult');
            resultDiv.innerHTML = 'Testing Three.js...';
            resultDiv.className = '';
            
            try {
                // Try to import Three.js
                const THREE = await import('three');
                
                // Create a simple scene
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer();
                
                // Create a simple cube
                const geometry = new THREE.BoxGeometry();
                const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
                const cube = new THREE.Mesh(geometry, material);
                scene.add(cube);
                
                camera.position.z = 5;
                
                // Render the scene
                renderer.render(scene, camera);
                
                resultDiv.innerHTML = 'Three.js is working correctly!';
                resultDiv.className = 'success';
            } catch (error) {
                resultDiv.innerHTML = `Error testing Three.js: ${error.message}`;
                resultDiv.className = 'error';
                console.error('Error testing Three.js:', error);
            }
        });
    </script>
</body>
</html>
