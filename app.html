<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonicity - 3D City Building Game</title>
    <link rel="stylesheet" href="/src/styles/main.css">
    <link rel="stylesheet" href="/src/styles/layout.css">
</head>
<body>
    <!-- Layout Structure -->
    <div id="app">
        <!-- Persistent Header -->
        <header id="main-header">
            <div class="logo">Sonicity</div>
            <nav>
                <ul>
                    <li><a href="#/game" class="nav-link" data-page="game">Game</a></li>
                    <li><a href="#/mint" class="nav-link" data-page="mint">Mint NFT</a></li>
                </ul>
            </nav>
            <div class="wallet-info">
                <span id="wallet-status">Not Connected</span>
                <button id="connect-wallet">Connect Wallet</button>
            </div>
        </header>
        
        <!-- Content Area -->
        <main id="content-area">
            <!-- Pages will be loaded here -->
            <div id="game-page" class="page active"></div>
            <div id="mint-page" class="page"></div>
        </main>
    </div>
    
    <!-- Scripts -->
    <script src="https://unpkg.com/navigo@8.11.0/dist/browser/navigo.min.js"></script>
    <script type="module" src="/src/js/app.js"></script>
</body>
</html>
